<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digii Deadlines</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script src="sidepanel.js" defer></script>
  <script src="assignment-icons.js" defer></script>
</head>
<body>
  <header>
    <div class="heading">
      <h1 aria-label="Digii Deadlines"><svg class="wordmark-d" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M22 0h28a50 50 0 0 1 0 100H0V22Zm5 24v53h23a26.5 26.5 0 0 0 0-53Z"/><path class="wordmark-fold" d="M0 22 22 0v22Z"/></svg>igii Deadlines</h1>
    </div>
    <div class="header-actions">
      <button id="theme" type="button" aria-label="Light mode" aria-pressed="true" title="Switch to dark mode">
        <svg class="bulb" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path class="bulb-rays" d="M12 2v1.5M4.9 5l1.2 1.2M2 11h1.7M19.1 5l-1.2 1.2M22 11h-1.7"/>
          <path class="bulb-glass" d="M9.5 17.5v-2c-1.7-.9-2.7-2.4-2.7-4.3a5.2 5.2 0 1 1 10.4 0c0 1.9-1 3.4-2.7 4.3v2z"/>
          <path d="M10 20h4M11 22h2"/>
        </svg>
      </button>
      <button id="refresh" type="button" title="Refresh the dashboard" aria-label="Refresh the dashboard">↻</button>
    </div>
  </header>
  <nav class="views" aria-label="Assignment views">
    <button id="upcoming-view" type="button" aria-pressed="true"><span class="tab-icon" aria-hidden="true"></span>Upcoming</button>
    <button id="past-view" type="button" aria-pressed="false"><span class="tab-icon" aria-hidden="true"></span>Past Assignments</button>
  </nav>
  <main>
    <p id="status" role="status">Checking your DigiiCampus tab…</p>
    <section id="empty-upcoming" class="empty-state" aria-label="No upcoming assignments" hidden>
      <span class="empty-icon" aria-hidden="true"></span>
      <strong>Nothing due</strong>
      <p>You’re all caught up on upcoming assignments.</p>
    </section>
    <ol id="deadlines" aria-label="Assignment deadlines" hidden></ol>
    <section id="history" aria-label="Past assignments by subject" hidden></section>
  </main>
  <footer>
    <a id="campus" href="https://snuc.digiicampus.com/" target="_blank" rel="noopener">Open DigiiSNUC <span aria-hidden="true">↗</span></a>
    <span class="credit">Made by <a href="https://gliminmorais.vercel.app/" target="_blank" rel="noopener">Glimin S Morais</a></span>
  </footer>
</body>
</html>
