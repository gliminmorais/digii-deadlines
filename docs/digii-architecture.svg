<text x="58" y="190" fill="#284fae" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" text-anchor="start">USER’S BROWSER</text>
<text x="621" y="199" fill="#284fae" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" text-anchor="middle">SIGNED-IN DIGIICAMPUS TAB</text>
<text x="1054" y="190" fill="#146b63" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" text-anchor="middle">DIGIICAMPUS SERVER</text>
<rect x="56" y="217" width="265" height="198" rx="18" fill="#fff" stroke="#cdd8e9" stroke-width="1.5"/><text x="76" y="249" fill="#284fae" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="720" text-anchor="start">EXTENSION UI</text><text x="76" y="283" fill="#17243d" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Dashboard</text><text x="76" y="310" fill="#475a75" font-family="Consolas, monospace" font-size="16" font-weight="400" text-anchor="start">sidepanel.js</text><text x="76" y="345" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Finds the campus tab</text><text x="76" y="373" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Shows upcoming and</text><text x="76" y="401" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">past assignments</text>
<rect x="487" y="217" width="268" height="198" rx="18" fill="#fff" stroke="#cdd8e9" stroke-width="1.5"/><text x="507" y="249" fill="#284fae" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="720" text-anchor="start">CONTENT SCRIPT</text><text x="507" y="283" fill="#17243d" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Assignment sync</text><text x="507" y="310" fill="#475a75" font-family="Consolas, monospace" font-size="16" font-weight="400" text-anchor="start">sync.js</text><text x="507" y="345" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Reads paginated results</text><text x="507" y="373" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Normalizes assignments</text><text x="507" y="401" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Caches results in the tab</text>
<rect x="924" y="217" width="260" height="198" rx="18" fill="#f7fffd" stroke="#badcd5" stroke-width="1.5"/><text x="944" y="249" fill="#146b63" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="720" text-anchor="start">SAME-ORIGIN API</text><text x="944" y="283" fill="#17243d" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Campus API</text><text x="944" y="310" fill="#475a75" font-family="Consolas, monospace" font-size="16" font-weight="400" text-anchor="start">snuc.digiicampus.com</text><text x="944" y="345" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Course list and</text><text x="944" y="373" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">assignment pages</text><text x="944" y="401" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Read-only requests</text>
