<rect x="56" y="512" width="265" height="153" rx="18" fill="#fff" stroke="#cdd8e9" stroke-width="1.5"/><text x="76" y="544" fill="#284fae" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="720" text-anchor="start">LOCAL BROWSER STORAGE</text><text x="76" y="578" fill="#17243d" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Last sync time</text><text x="76" y="605" fill="#475a75" font-family="Consolas, monospace" font-size="16" font-weight="400" text-anchor="start">storage.local</text><text x="76" y="640" fill="#475a75" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Stores one timestamp</text>
