<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="758" viewBox="0 0 1240 758" role="img" aria-labelledby="title description">
<title id="title">Digii Deadlines architecture</title>
<desc id="description">Inside the browser, the dashboard requests assignment records from a content script in a signed-in DigiiCampus tab. The script uses the existing session to read courses and assignment pages from the campus server, normalizes records, and caches them in tab memory. After a complete sync, the extension background updates the last sync time in local browser storage, which the dashboard reads.</desc>
